<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
    <!-- Fond carré arrondi sombre/bleu -->
    <rect width="512" height="512" rx="128" fill="#0f172a"/>
    
    <!-- Cercle de fond avec bordure bleue -->
    <circle cx="256" cy="256" r="200" fill="none" stroke="#3b82f6" stroke-width="16" opacity="0.4"/>
    
    <!-- Monogramme ZB -->
    <text 
        x="50%" 
        y="54%" 
        dominant-baseline="middle" 
        text-anchor="middle" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-weight="900" 
        font-size="220" 
        fill="#60a5fa" 
        letter-spacing="-10">
        ZB
    </text>
</svg>
